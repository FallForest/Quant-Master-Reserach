quant_master_init:
    provider_uri: "~/.quant_master/quant_master_data/tdx_cn_data"
    region: cn
market: &market csi300
benchmark: &benchmark SH000300
us_market_factor_path: &us_market_factor_path "~/.quant_master/quant_master_data/us_market_factors/us_market_daily.parquet"
data_handler_config: &data_handler_config
    start_time: 2018-01-01
    end_time: 2024-12-31
    fit_start_time: 2020-01-01
    fit_end_time: 2022-12-31
    instruments: *market
    shared_processors:
        - class: USMarketFeatureJoin
          module_path: quant_master.contrib.data.processor
          kwargs:
              factor_path: *us_market_factor_path
              fields_group: feature
              fill_value: 0.0
task:
    model:
        class: LGBModel
        module_path: quant_master.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: quant_master.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2022-12-31]
                valid: [2023-01-01, 2023-12-31]
                test: [2024-01-01, 2024-12-31]
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
