qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: AdaptiveEnsembleModel
        module_path: qlib.contrib.model.adaptive_ensemble
        kwargs:
            enable_lightgbm: True
            enable_extratrees: True
            enable_ridge: True
            lgb_num_boost_round: 800
            lgb_early_stopping_rounds: 80
            ridge_alpha: 4.0
            lgb_params:
                learning_rate: 0.03
                num_leaves: 255
                max_depth: 10
                min_data_in_leaf: 120
                lambda_l1: 1.0
                lambda_l2: 20.0
                feature_fraction: 0.9
                bagging_fraction: 0.9
                bagging_freq: 1
                num_threads: 20
            extratrees_params:
                n_estimators: 240
                max_depth: 12
                min_samples_leaf: 80
                max_features: 0.35
                n_jobs: 1
                random_state: 42
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
