name: "Alpha158 Liquidity State"
display_name: "Alpha158 Liquidity State Ensemble"
description: >
  浣跨敤 Alpha158LiquidityState 鏁版嵁澶勭悊鍣紙闈炴櫘閫?Alpha158锛夛紝妯″瀷涓诲共涓?Double Ensemble銆?  random_state=42锛宼opk=45锛宯_drop=4锛屾垚鏈劅鐭ユ墽琛屻€?
quant_master_init:
    provider_uri: "~/.quant_master/quant_master_data/tdx_cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: quant_master.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 3
            n_drop: 1
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 13000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0001
            close_cost: 0.0006
            min_cost: 0
task:
    model:
        class: RegimeHorizonCostEnsembleModel
        module_path: quant_master.contrib.model.regime_horizon_cost_ensemble
        kwargs:
            horizon_model_specs:
                - name: de_h1
                  model_type: double_ensemble
                  horizon: 1
                  model_kwargs:
                      base_model: gbm
                      loss: mse
                      num_models: 3
                      enable_sr: true
                      enable_fs: true
                      alpha1: 1
                      alpha2: 1
                      bins_sr: 10
                      bins_fs: 5
                      decay: 0.5
                      sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
                      sub_weights: [1, 1, 1]
                      epochs: 28
                      colsample_bytree: 0.8879
                      learning_rate: 0.2
                      subsample: 0.8789
                      lambda_l1: 205.6999
                      lambda_l2: 580.9768
                      max_depth: 8
                      num_leaves: 210
                      num_threads: 20
                      verbosity: -1
                      random_state: 42
            topk: 3
            search_step: 0.1
            turnover_penalty: 0.0007
            risk_penalty: 0.0
            memory_boost_grid: [0.0, 0.005]
            use_rank_score: false
            zscore_clip: 100.0
            neutralize_daily_mean: false
            enforce_horizon_monotonic: false
            random_state: 42
    dataset:
        class: DatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: Alpha158LiquidityState
                module_path: quant_master.contrib.data.liquidity_state_handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            ana_long_short: false
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            config: *port_analysis_config

