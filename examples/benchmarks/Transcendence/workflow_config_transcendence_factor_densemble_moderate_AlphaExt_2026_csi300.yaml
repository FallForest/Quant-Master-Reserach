quant_master_init:
    provider_uri: ".qmData/cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
experiment_name: Transcendence_AlphaExt_DEnsemble_Moderate_20260520
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2023-12-31
    instruments: *market
    benchmark: *benchmark
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: quant_master.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: DEnsembleModel
        module_path: quant_master.contrib.model.double_ensemble
        kwargs:
            base_model: gbm
            loss: mse
            num_models: 3
            enable_sr: false
            enable_fs: false
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
            sub_weights: [1, 1, 1]
            epochs: 180
            early_stopping_rounds: 40
            learning_rate: 0.05
            num_leaves: 127
            max_depth: 8
            min_data_in_leaf: 160
            feature_fraction: 0.9
            bagging_fraction: 0.9
            bagging_freq: 1
            lambda_l1: 1.0
            lambda_l2: 80.0
            num_threads: 8
            seed: 42
            feature_fraction_seed: 42
            bagging_seed: 42
            data_random_seed: 42
            random_state: 42
            verbosity: -1
    dataset:
        class: DatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: TranscendenceAlpha
                module_path: quant_master.contrib.data.transcendence_handler
                kwargs: *data_handler_config
            segments:
                train: [2016-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            ana_long_short: false
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            config: *port_analysis_config
