quant_master_init:
  provider_uri: C:\Users\15728\.quant_master\quant_master_data\tdx_cn_data
  region: cn
  kernels: 1
  joblib_backend: threading
market: csi300
benchmark: SH000300
data_handler_config: &id001
  start_time: 2008-01-01
  end_time: 2026-04-30
  fit_start_time: 2008-01-01
  fit_end_time: 2018-12-31
  instruments: csi300
port_analysis_config: &id004
  strategy:
    class: SoftTopkStrategy
    module_path: quant_master.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 3
      risk_degree: 1.0
      trade_impact_limit: 0.25
      selection_rank_buffer: 1
      selection_max_new_names: 1
      dynamic_risk_gate:
        enabled: true
        mode: drawdown
        lookback: 20
        drawdown_threshold: 0.07
        full_clamp_threshold: 0.15
        min_risk_degree: 0.45
        recovery_rate: 0.08
        decay_rate: 1.0
  backtest:
    start_time: &id002 2024-01-01
    end_time: &id003 2026-04-30
    account: 13000
    benchmark: SH000300
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0001
      close_cost: 0.0006
      min_cost: 0
task:
  model:
    class: TranscendenceSignalEnsembleModel
    module_path: quant_master.contrib.model.transcendence_signal_ensemble
    kwargs:
      use_rank_score: true
      search_step: 0.5
      max_random_weight_candidates: 1
      refine_top_weight_candidates: 1
      topk_grid:
      - 3
      n_drop_grid:
      - 1
      memory_boost_grid:
      - 0.0
      turnover_penalty_grid:
      - 0.0012
      - 0.0018
      - 0.0025
      - 0.0035
      volatility_penalty_grid:
      - 0.03
      open_cost: 0.0001
      close_cost: 0.0006
      ir_weight: 1.0
      annret_weight: 3.0
      hit_ratio_weight: 0.15
      max_drawdown_penalty: 0.6
      ann_scaler: 252
      random_state: 42
      weight_constraints:
        anchor_index: 0
        max_aux_weight: 0.05
      manual_weight_candidates:
      - regime_horizon_cpu_anchor: 1.0
        finite_dnn_aux_cpu_safe: 0.0
      - regime_horizon_cpu_anchor: 0.98
        finite_dnn_aux_cpu_safe: 0.02
      - regime_horizon_cpu_anchor: 0.95
        finite_dnn_aux_cpu_safe: 0.05
      base_learner_specs:
      - name: regime_horizon_cpu_anchor
        model_type: regime_horizon
        model_kwargs:
          horizon_model_specs:
          - name: de_h1
            model_type: double_ensemble
            horizon: 1
            model_kwargs:
              base_model: gbm
              loss: mse
              num_models: 1
              enable_sr: false
              enable_fs: false
              alpha1: 1
              alpha2: 1
              bins_sr: 10
              bins_fs: 5
              decay: 0.5
              sample_ratios:
              - 0.8
              - 0.7
              - 0.6
              - 0.5
              - 0.4
              sub_weights:
              - 1
              epochs: 4
              colsample_bytree: 0.8879
              learning_rate: 0.2
              subsample: 0.8789
              lambda_l1: 205.6999
              lambda_l2: 580.9768
              max_depth: 8
              num_leaves: 210
              num_threads: 4
              verbosity: -1
              random_state: 42
          - name: lgb_h5
            model_type: lightgbm
            horizon: 5
            model_kwargs:
              loss: mse
              early_stopping_rounds: 20
              num_boost_round: 80
              colsample_bytree: 0.8879
              learning_rate: 0.03
              subsample: 0.8789
              lambda_l1: 10.0
              lambda_l2: 120.0
              max_depth: 8
              min_data_in_leaf: 120
              num_leaves: 255
              num_threads: 4
              seed: 42
              feature_fraction_seed: 42
              bagging_seed: 42
              data_random_seed: 42
          topk: 3
          search_step: 0.1
          turnover_penalty: 0.0018
          risk_penalty: 0.08
          turnover_penalty_grid:
          - 0.0012
          - 0.0018
          - 0.0025
          - 0.0035
          risk_penalty_grid:
          - 0.08
          - 0.12
          - 0.16
          memory_boost_grid:
          - 0.0
          robust_rank_blend_grid:
          - 0.0
          prediction_shrinkage_grid:
          - 1.0
          use_rank_score: true
          zscore_clip: 2.8
          neutralize_daily_mean: true
          enforce_horizon_monotonic: true
          monotonic_direction: decreasing
          regime_consensus_quantiles:
          - 0.5
          regime_disagreement_quantiles:
          - 0.5
          min_regime_samples: 120
          weight_constraints:
            anchor_model: de_h1
            min_anchor_weight: 0.9
            max_aux_weight: 0.05
            model_max_weights:
              lgb_h5: 0.05
          random_state: 42
      - name: finite_dnn_aux_cpu_safe
        model_type: deep_aux
        class: FiniteDNNModelPytorch
        module_path: quant_master.contrib.model.finite_dnn
        model_kwargs:
          input_dim: 158
          layers:
          - 32
          - 8
          lr: 0.001
          batch_size: 4096
          max_steps: 8
          early_stop_rounds: 3
          eval_steps: 2
          optimizer: adam
          loss: mse
          GPU: -1
          seed: 42
          weight_decay: 0.0003
          feature_fill_value: 0.0
          feature_daily_zscore: true
          label_rank: true
  dataset:
    class: DatasetH
    module_path: quant_master.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: quant_master.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - &id005 2008-01-01
        - &id006 2018-12-31
        valid:
        - &id007 2019-01-01
        - &id008 2023-12-31
        test:
        - *id002
        - *id003
  record:
  - class: SignalRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      config: *id004
runner_metadata:
  mode: smoke
  preserve_config_windows: true
  actual_segments:
    train:
    - 2008-01-01
    - 2018-12-31
    valid:
    - 2019-01-01
    - 2023-12-31
    test:
    - 2024-01-01
    - 2026-04-30
  actual_train:
  - *id005
  - *id006
  actual_valid:
  - *id007
  - *id008
  actual_test:
  - *id002
  - *id003
  window_overrides: []
  budget_overrides:
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.robust_rank_blend_grid
    old:
    - 0.0
    - 0.15
    new:
    - 0.0
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.prediction_shrinkage_grid
    old:
    - 1.0
    - 0.9
    - 0.8
    new:
    - 1.0
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.regime_consensus_quantiles
    old:
    - 0.25
    - 0.5
    - 0.75
    new:
    - 0.5
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.min_regime_samples
    old: 500
    new: 120
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[0].model_kwargs.num_models
    old: 3
    new: 1
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[0].model_kwargs.epochs
    old: 28
    new: 4
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[0].model_kwargs.sub_weights
    old:
    - 1
    - 1
    - 1
    new:
    - 1
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[0].model_kwargs.enable_sr
    old: true
    new: false
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[0].model_kwargs.enable_fs
    old: true
    new: false
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[0].model_kwargs.num_threads
    old: 16
    new: 4
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[1].model_kwargs.num_boost_round
    old: 1000
    new: 80
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[1].model_kwargs.early_stopping_rounds
    old: 80
    new: 20
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.horizon_model_specs[1].model_kwargs.num_threads
    old: 16
    new: 4
  selection_grid_decisions:
  - path: task.model.kwargs.search_step
    key: search_step
    action: overridden
    reason: smoke uses quick default candidate search budget
    old: 0.5
    new: 0.5
  - path: task.model.kwargs.memory_boost_grid
    key: memory_boost_grid
    action: overridden
    reason: smoke uses quick default candidate search budget
    old:
    - 0.0
    new:
    - 0.0
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.robust_rank_blend_grid
    key: robust_rank_blend_grid
    action: overridden
    reason: smoke uses quick default final-control search budget
    old:
    - 0.0
    - 0.15
    new:
    - 0.0
  - path: 
      task.model.kwargs.base_learner_specs[0].model_kwargs.prediction_shrinkage_grid
    key: prediction_shrinkage_grid
    action: overridden
    reason: smoke uses quick default final-control search budget
    old:
    - 1.0
    - 0.9
    - 0.8
    new:
    - 1.0
  protocol:
    open_cost: 0.0001
    close_cost: 0.0006
