quant_master_init:
  provider_uri: C:\Users\15728\Desktop\Quant-Master-Research\.qmData\cn_data
  region: cn
  kernels: 1
  joblib_backend: threading
market: csi300
benchmark: SH000300
data_handler_config: &id001
  start_time: '2019-01-01'
  end_time: '2026-04-30'
  fit_start_time: '2020-01-01'
  fit_end_time: '2022-12-31'
  instruments: csi300
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: quant_master.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 45
      n_drop: 4
  backtest:
    start_time: '2024-01-01'
    end_time: '2026-04-30'
    account: 100000000
    benchmark: SH000300
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: RegimeHorizonCostEnsembleModel
    module_path: quant_master.contrib.model.regime_horizon_cost_ensemble
    kwargs:
      horizon_model_specs:
      - name: de_h1
        model_type: double_ensemble
        horizon: 1
        model_kwargs:
          base_model: gbm
          loss: mse
          num_models: 3
          enable_sr: true
          enable_fs: true
          alpha1: 1
          alpha2: 1
          bins_sr: 10
          bins_fs: 5
          decay: 0.5
          sample_ratios:
          - 0.8
          - 0.7
          - 0.6
          - 0.5
          - 0.4
          sub_weights:
          - 1
          - 1
          - 1
          epochs: 28
          colsample_bytree: 0.8879
          learning_rate: 0.2
          subsample: 0.8789
          lambda_l1: 205.6999
          lambda_l2: 580.9768
          max_depth: 8
          num_leaves: 210
          num_threads: 20
          verbosity: -1
          random_state: 42
      topk: 45
      search_step: 0.1
      turnover_penalty: 5e-05
      risk_penalty: 0.0
      memory_boost_grid:
      - 0.0
      - 0.005
      use_rank_score: false
      zscore_clip: 100.0
      neutralize_daily_mean: false
      enforce_horizon_monotonic: false
      robust_rank_blend_grid:
      - 0.0
      - 0.15
      prediction_shrinkage_grid:
      - 1.0
      - 0.9
      random_state: 42
      min_regime_samples: 0
  dataset:
    class: DatasetH
    module_path: quant_master.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: quant_master.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '2020-01-01'
        - '2022-12-31'
        valid:
        - '2023-01-01'
        - '2023-12-31'
        test:
        - '2024-01-01'
        - '2026-04-30'
  record:
  - class: SignalRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      config: *id002
