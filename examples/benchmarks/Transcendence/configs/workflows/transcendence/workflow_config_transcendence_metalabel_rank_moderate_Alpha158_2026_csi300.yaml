quant_master_init:
    provider_uri: "~/.quant_master/quant_master_data/tdx_cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
experiment_name: Transcendence_MetaLabel_Rank_Moderate_20260520
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2014-01-01
    end_time: 2026-04-30
    fit_start_time: 2016-01-01
    fit_end_time: 2023-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: quant_master.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0001
            close_cost: 0.0006
            min_cost: 0
task:
    model:
        class: TopKMetaLabelModel
        module_path: quant_master.contrib.model.topk_meta_label_model
        kwargs:
            target_mode: rank
            top_quantile: 0.1
            loss: mse
            early_stopping_rounds: 80
            num_boost_round: 700
            learning_rate: 0.03
            num_leaves: 127
            feature_fraction: 0.9
            bagging_fraction: 0.9
            bagging_freq: 1
            min_data_in_leaf: 120
            lambda_l1: 2.0
            lambda_l2: 80.0
            num_threads: 8
            seed: 42
            feature_fraction_seed: 42
            bagging_seed: 42
            data_random_seed: 42
    dataset:
        class: DatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: quant_master.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2016-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            ana_long_short: false
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            config: *port_analysis_config

