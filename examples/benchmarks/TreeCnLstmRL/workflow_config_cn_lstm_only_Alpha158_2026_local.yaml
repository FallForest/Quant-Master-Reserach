quant_master_init:
    provider_uri: "~/.quant_master/quant_master_data/cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: quant_master.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0001
            close_cost: 0.0006
            min_cost: 0
task:
    model:
        class: CnLSTM
        module_path: quant_master.contrib.model.pytorch_cn_lstm_ts
        kwargs:
            d_feat: 158
            conv_channels: 256
            kernel_size: 3
            hidden_size: 256
            num_layers: 3
            dropout: 0.1
            n_epochs: 120
            lr: 1e-3
            early_stop: 20
            batch_size: 2048
            metric: loss
            loss: mse
            optimizer: adam
            n_jobs: 4
            prefetch_factor: 2
            persistent_workers: False
            GPU: 0
            seed: 42
    dataset:
        class: TSDatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: quant_master.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
            step_len: 20
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            config: *port_analysis_config

