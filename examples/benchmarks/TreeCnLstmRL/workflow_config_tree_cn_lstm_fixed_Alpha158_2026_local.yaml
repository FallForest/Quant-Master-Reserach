quant_master_init:
    provider_uri: "~/.quant_master/quant_master_data/cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: quant_master.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0001
            close_cost: 0.0006
            min_cost: 0
task:
    model:
        class: TreeCnLstmRLModel
        module_path: quant_master.contrib.model.tree_cn_lstm_rl
        kwargs:
            rl_lr: 0.15
            rl_epochs: 300
            entropy_coef: 0.01
            reward_method: rank_ic
            topk: 50
            use_rank_score: True
            fixed_weights:
                tree: 0.5
                cn_lstm: 0.5
            parallel_submodels: False
            random_state: 42
            tree_kwargs:
                loss: mse
                early_stopping_rounds: 80
                num_boost_round: 1000
                colsample_bytree: 0.8879
                learning_rate: 0.03
                subsample: 0.8789
                lambda_l1: 10.0
                lambda_l2: 120.0
                max_depth: 8
                min_data_in_leaf: 120
                num_leaves: 255
                num_threads: 20
            cn_lstm_kwargs:
                d_feat: 158
                conv_channels: 256
                kernel_size: 3
                hidden_size: 256
                num_layers: 3
                dropout: 0.1
                n_epochs: 120
                lr: 1e-3
                early_stop: 20
                batch_size: 2048
                metric: loss
                loss: mse
                optimizer: adam
                n_jobs: 4
                prefetch_factor: 2
                persistent_workers: False
                GPU: 0
    dataset:
        class: TSDatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: quant_master.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
            step_len: 20
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            config: *port_analysis_config

