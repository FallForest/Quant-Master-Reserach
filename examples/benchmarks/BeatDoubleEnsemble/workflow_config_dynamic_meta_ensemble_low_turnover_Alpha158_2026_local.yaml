quant_master_init:
    provider_uri: "~/.quant_master/quant_master_data/cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: quant_master.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: DynamicMetaEnsembleModel
        module_path: quant_master.contrib.model.dynamic_meta_ensemble
        kwargs:
            topk: 50
            num_regimes: 3
            search_step: 0.1
            turnover_penalty: 0.0002
            turnover_boost_grid: [0.0, 0.01, 0.02, 0.03, 0.05]
            use_rank_score: True
            random_state: 42
            double_ensemble_kwargs:
                base_model: gbm
                loss: mse
                num_models: 3
                enable_sr: True
                enable_fs: True
                alpha1: 1
                alpha2: 1
                bins_sr: 10
                bins_fs: 5
                decay: 0.5
                sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
                sub_weights: [1, 1, 1]
                epochs: 28
                colsample_bytree: 0.8879
                learning_rate: 0.2
                subsample: 0.8789
                lambda_l1: 205.6999
                lambda_l2: 580.9768
                max_depth: 8
                num_leaves: 210
                num_threads: 20
                verbosity: -1
            lightgbm_kwargs:
                loss: mse
                early_stopping_rounds: 80
                num_boost_round: 800
                colsample_bytree: 0.8879
                learning_rate: 0.03
                subsample: 0.8789
                lambda_l1: 10.0
                lambda_l2: 120.0
                max_depth: 8
                min_data_in_leaf: 120
                num_leaves: 255
                num_threads: 20
            linear_kwargs:
                estimator: ridge
                alpha: 2.0
                fit_intercept: False
                include_valid: False
    dataset:
        class: DatasetH
        module_path: quant_master.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: quant_master.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: quant_master.workflow.record_temp
          kwargs:
            config: *port_analysis_config
