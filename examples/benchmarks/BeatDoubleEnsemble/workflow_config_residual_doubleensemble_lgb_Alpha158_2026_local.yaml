qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
    kernels: 1
    joblib_backend: threading
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2026-04-30
    fit_start_time: 2012-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: ResidualDEnsembleLGBModel
        module_path: qlib.contrib.model.residual_double_ensemble_lgb
        kwargs:
            topk: 50
            turnover_penalty: 0.0002
            residual_weight_grid: [-0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0]
            residual_num_boost_round: 500
            residual_early_stopping_rounds: 50
            use_rank_score: True
            random_state: 42
            double_ensemble_kwargs:
                base_model: gbm
                loss: mse
                num_models: 3
                enable_sr: True
                enable_fs: True
                alpha1: 1
                alpha2: 1
                bins_sr: 10
                bins_fs: 5
                decay: 0.5
                sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
                sub_weights: [1, 1, 1]
                epochs: 28
                colsample_bytree: 0.8879
                learning_rate: 0.2
                subsample: 0.8789
                lambda_l1: 205.6999
                lambda_l2: 580.9768
                max_depth: 8
                num_leaves: 210
                num_threads: 20
                verbosity: -1
            residual_lgb_params:
                learning_rate: 0.03
                num_leaves: 127
                max_depth: 8
                min_data_in_leaf: 180
                feature_fraction: 0.85
                bagging_fraction: 0.85
                bagging_freq: 1
                lambda_l1: 20.0
                lambda_l2: 200.0
                num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2020-12-31]
                valid: [2021-01-01, 2023-12-31]
                test: [2024-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
