# ============================================================
#  模型注册表 — 单一数据源，模型工坊和选股页面共用
# ============================================================

# ---- Handlers ----
handlers:
  alpha158:
    label: Alpha158 (158 特征)
    import_path: quant_master.contrib.data.handler
    class_name: Alpha158
  alpha360:
    label: Alpha360 (360 特征)
    import_path: quant_master.contrib.data.handler
    class_name: Alpha360

# ---- Models ----
# 每个模型条目字段:
#   id            唯一标识符
#   label         显示名称
#   category      分组
#   desc          描述
#   handler       默认数据处理器 (alpha158 / alpha360)
#   import_path   模块路径 (用于选股训练)
#   class_name    类名 (用于选股训练)
#   default_params 构造函数默认参数
#   icon          图标标识
#   complexity    复杂度 1-5
#   speed         训练速度 1-5
#   params        前端展示的超参数配置 (label/default/min/max/step)
#   strategy_overrides 推荐策略参数覆盖 (可选)

models:
  # === 树模型 ===
  lightgbm:
    label: LightGBM
    category: 树模型
    desc: 微软开源的梯度提升框架，训练速度快，内存占用低，适合大规模表格数据
    handler: alpha158
    import_path: quant_master.contrib.model.gbdt
    class_name: LGBModel
    default_params:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
      verbosity: -1
    icon: tree
    complexity: 1
    speed: 5
    params:
      n_estimators: {label: 树数量, default: 500, min: 50, max: 2000}
      learning_rate: {label: 学习率, default: 0.02, min: 0.001, max: 0.3, step: 0.001}
      num_leaves: {label: 叶子数, default: 64, min: 10, max: 256}
      max_depth: {label: 最大深度, default: 6, min: 3, max: 15}
      colsample_bytree: {label: 列采样率, default: 0.8, min: 0.1, max: 1.0, step: 0.05}

  xgboost:
    label: XGBoost
    category: 树模型
    desc: 经典梯度提升库，正则化能力强，支持自定义目标函数
    handler: alpha158
    import_path: quant_master.contrib.model.xgboost
    class_name: XGBModel
    default_params: {}
    icon: tree
    complexity: 1
    speed: 4
    params:
      n_estimators: {label: 树数量, default: 500, min: 50, max: 2000}
      learning_rate: {label: 学习率, default: 0.02, min: 0.001, max: 0.3, step: 0.001}
      max_depth: {label: 最大深度, default: 6, min: 3, max: 15}
      subsample: {label: 行采样率, default: 0.8, min: 0.1, max: 1.0, step: 0.05}

  catboost:
    label: CatBoost
    category: 树模型
    desc: Yandex开源的梯度提升库，自动处理类别特征，支持GPU加速
    handler: alpha158
    import_path: quant_master.contrib.model.catboost
    class_name: CatBoostModel
    default_params: {}
    icon: tree
    complexity: 1
    speed: 4
    params:
      iterations: {label: 迭代数, default: 500, min: 50, max: 2000}
      learning_rate: {label: 学习率, default: 0.03, min: 0.001, max: 0.3, step: 0.001}
      depth: {label: 深度, default: 6, min: 3, max: 16}

  topk_metalabel:
    label: TopK MetaLabel
    category: 树模型
    desc: 元标签LightGBM，通过截面元标签提升模型精确率，支持top_bottom/top_only/rank三种模式
    handler: alpha158
    import_path: quant_master.contrib.model.topk_metalabel
    class_name: TopkMetaLabelModel
    default_params: {}
    icon: tree
    complexity: 2
    speed: 4
    params:
      n_estimators: {label: 树数量, default: 500, min: 50, max: 2000}
      learning_rate: {label: 学习率, default: 0.02, min: 0.001, max: 0.3, step: 0.001}
      meta_mode: {label: 元标签模式, default: top_bottom}
      meta_threshold: {label: 元标签阈值, default: 0.3, min: 0.05, max: 0.5, step: 0.05}

  hflgb:
    label: HF-LightGBM
    category: 树模型
    desc: 高频LightGBM，专为1分钟级数据优化，内置信号指标计算和换手控制
    handler: alpha158
    import_path: quant_master.contrib.model.hf_lgb
    class_name: HFLGBModel
    default_params: {}
    icon: tree
    complexity: 2
    speed: 5
    params:
      n_estimators: {label: 树数量, default: 500, min: 50, max: 2000}
      learning_rate: {label: 学习率, default: 0.02, min: 0.001, max: 0.3, step: 0.001}
      num_leaves: {label: 叶子数, default: 64, min: 10, max: 256}

  # === RNN ===
  lstm:
    label: LSTM
    category: RNN
    desc: 长短期记忆网络，捕捉时间序列中的长期依赖关系
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_lstm
    class_name: LSTM
    default_params:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.001
      GPU: 0
      seed: 0
      metric: mse
      save_path: model/lstm
    icon: rnn
    complexity: 3
    speed: 2
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: 层数, default: 2, min: 1, max: 5}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}
      n_epochs: {label: 训练轮数, default: 100, min: 10, max: 500}

  gru:
    label: GRU
    category: RNN
    desc: 门控循环单元，比LSTM参数更少，训练更快
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_gru
    class_name: GRU
    default_params:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.001
      GPU: 0
      seed: 0
      metric: mse
      save_path: model/gru
    icon: rnn
    complexity: 3
    speed: 3
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: 层数, default: 2, min: 1, max: 5}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}

  alstm:
    label: ALSTM
    category: RNN
    desc: 注意力增强的LSTM，通过注意力机制自动学习不同时间步的重要性
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_alstm
    class_name: ALSTM
    default_params:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.001
      GPU: 0
      seed: 0
      metric: mse
      save_path: model/alstm
    icon: rnn
    complexity: 4
    speed: 2
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: 层数, default: 2, min: 1, max: 5}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}

  adarnn:
    label: ADARNN
    category: RNN
    desc: 对抗域自适应RNN，通过梯度反转学习域不变时序特征，适合跨市场/跨周期迁移
    handler: alpha360
    import_path: quant_master.contrib.model.adarnn
    class_name: ADARNNModel
    default_params: {}
    icon: rnn
    complexity: 4
    speed: 2
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: 层数, default: 2, min: 1, max: 5}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}

  krnn:
    label: KRNN
    category: RNN
    desc: Kolmogorov-Arnold RNN，CNN+RNN双编码器，CNN提取截面特征，RNN捕获时序依赖
    handler: alpha360
    import_path: quant_master.contrib.model.krnn
    class_name: KRNNModel
    default_params: {}
    icon: rnn
    complexity: 4
    speed: 2
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: RNN层数, default: 2, min: 1, max: 5}
      kernel_size: {label: CNN卷积核, default: 3, min: 2, max: 7}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}

  tcts:
    label: TCTS
    category: RNN
    desc: 双流模型：预测器生成收益预测，权重优化器独立学习最优组合权重
    handler: alpha360
    import_path: quant_master.contrib.model.tcts
    class_name: TCTSModel
    default_params: {}
    icon: rnn
    complexity: 4
    speed: 2
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      n_epochs: {label: 训练轮数, default: 100, min: 10, max: 500}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}

  # === 注意力 ===
  transformer:
    label: Transformer
    category: 注意力
    desc: 基于自注意力机制的模型，捕获股票间的交叉关系和时间依赖
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_transformer
    class_name: Transformer
    default_params:
      d_feat: 6
      d_model: 64
      n_heads: 2
      d_ff: 128
      n_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.0001
      GPU: 0
      seed: 0
      metric: mse
      save_path: model/transformer
    icon: attention
    complexity: 5
    speed: 1
    params:
      d_model: {label: 模型维度, default: 64, min: 16, max: 256}
      n_heads: {label: 注意力头, default: 4, min: 1, max: 16}
      n_layers: {label: 编码器层数, default: 3, min: 1, max: 8}
      dropout: {label: Dropout, default: 0.1, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.0001, min: 0.00001, max: 0.01, step: 0.00001}

  gats:
    label: GATs
    category: 注意力
    desc: 图注意力网络，将股票关系建模为图结构，学习股票间的动态关联
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_gats
    class_name: GATs
    default_params:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.001
      GPU: 0
      seed: 0
      metric: mse
      save_path: model/gats
    icon: attention
    complexity: 5
    speed: 1
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: GAT层数, default: 2, min: 1, max: 5}
      n_heads: {label: 注意力头, default: 4, min: 1, max: 8}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}

  tft:
    label: TFT
    category: 注意力
    desc: Temporal Fusion Transformer，支持静态/已知/未知三种输入，可解释性强
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_tft
    class_name: TFTModel
    default_params: { n_epochs: 200, lr: 0.001, GPU: 0, seed: 0 }
    icon: attention
    complexity: 5
    speed: 1
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_attention_heads: {label: 注意力头, default: 4, min: 1, max: 8}
      dropout: {label: Dropout, default: 0.1, min: 0, max: 0.5, step: 0.05}

  localformer:
    label: LocalFormer
    category: 注意力
    desc: 局部注意力Transformer，用滑动窗口限制注意力范围，降低复杂度同时保持局部模式捕获能力
    handler: alpha360
    import_path: quant_master.contrib.model.localformer
    class_name: LocalFormerModel
    default_params: {}
    icon: attention
    complexity: 4
    speed: 2
    params:
      d_model: {label: 模型维度, default: 64, min: 16, max: 256}
      n_heads: {label: 注意力头, default: 4, min: 1, max: 16}
      n_layers: {label: 编码器层数, default: 3, min: 1, max: 8}
      window_size: {label: 窗口大小, default: 5, min: 2, max: 20}
      dropout: {label: Dropout, default: 0.1, min: 0, max: 0.5, step: 0.05}

  hist:
    label: HIST
    category: 注意力
    desc: 层次交互股票Transformer，通过股票-概念图和股票-指数关系建模层次化交互
    handler: alpha360
    import_path: quant_master.contrib.model.hist
    class_name: HISTModel
    default_params: {}
    icon: attention
    complexity: 5
    speed: 1
    params:
      d_model: {label: 模型维度, default: 64, min: 16, max: 256}
      n_heads: {label: 注意力头, default: 4, min: 1, max: 8}
      n_layers: {label: 编码器层数, default: 3, min: 1, max: 6}
      dropout: {label: Dropout, default: 0.1, min: 0, max: 0.5, step: 0.05}

  igmtf:
    label: IGMTF
    category: 注意力
    desc: 可解释生成式多因子Transformer，用生成式框架建模因子交互，支持因子贡献归因
    handler: alpha360
    import_path: quant_master.contrib.model.igmtf
    class_name: IGMTFModel
    default_params: {}
    icon: attention
    complexity: 5
    speed: 1
    params:
      d_model: {label: 模型维度, default: 64, min: 16, max: 256}
      n_heads: {label: 注意力头, default: 4, min: 1, max: 8}
      n_layers: {label: 编码器层数, default: 3, min: 1, max: 6}
      dropout: {label: Dropout, default: 0.1, min: 0, max: 0.5, step: 0.05}

  tra:
    label: TRA
    category: 注意力
    desc: 时序路由自适应模型，多状态路由机制自动选择最优预测路径，支持LSTM/Transformer骨干
    handler: alpha360
    import_path: quant_master.contrib.model.tra
    class_name: TRAModel
    default_params: {}
    icon: attention
    complexity: 5
    speed: 1
    params:
      d_model: {label: 模型维度, default: 64, min: 16, max: 256}
      n_states: {label: 路由状态数, default: 8, min: 2, max: 32}
      model_type: {label: 骨干网络, default: Transformer}
      update_freq: {label: 路由更新频率, default: 5, min: 1, max: 20}

  # === CNN ===
  tcn:
    label: TCN
    category: CNN
    desc: 时序卷积网络，用因果膨胀卷积捕获多尺度时间模式
    handler: alpha360
    import_path: quant_master.contrib.model.pytorch_tcn
    class_name: TCN
    default_params:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.001
      GPU: 0
      seed: 0
      metric: mse
      save_path: model/tcn
    icon: cnn
    complexity: 3
    speed: 3
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: 卷积层数, default: 4, min: 1, max: 10}
      kernel_size: {label: 卷积核, default: 3, min: 2, max: 7}
      dropout: {label: Dropout, default: 0.1, min: 0, max: 0.5, step: 0.05}

  tabnet:
    label: TabNet
    category: CNN
    desc: 面向表格数据的注意力网络，自动特征选择，可解释性强
    handler: alpha158
    import_path: quant_master.contrib.model.pytorch_tabnet
    class_name: TabnetModel
    default_params: { n_epochs: 200, lr: 0.001, GPU: 0, seed: 0 }
    icon: cnn
    complexity: 3
    speed: 3
    params:
      n_epochs: {label: 训练轮数, default: 100, min: 10, max: 500}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}

  sandwich:
    label: Sandwich
    category: CNN
    desc: 三明治架构：双编码器(CNN提取截面 + RNN捕获时序) + 融合层，结构对称清晰
    handler: alpha360
    import_path: quant_master.contrib.model.sandwich
    class_name: SandwichModel
    default_params: {}
    icon: cnn
    complexity: 4
    speed: 2
    params:
      hidden_size: {label: 隐藏层, default: 64, min: 16, max: 256}
      num_layers: {label: RNN层数, default: 2, min: 1, max: 5}
      kernel_size: {label: CNN卷积核, default: 3, min: 2, max: 7}
      dropout: {label: Dropout, default: 0.2, min: 0, max: 0.5, step: 0.05}

  # === DNN ===
  dnn:
    label: DNN
    category: DNN
    desc: 深度神经网络，多层全连接，适合横截面因子建模
    handler: alpha158
    import_path: quant_master.contrib.model.pytorch_nn
    class_name: DNNModelPytorch
    default_params: { n_epochs: 200, lr: 0.001, GPU: 0, seed: 0 }
    icon: dnn
    complexity: 2
    speed: 4
    params:
      hidden_size: {label: 隐藏层, default: 256, min: 32, max: 1024}
      num_layers: {label: 层数, default: 3, min: 1, max: 10}
      dropout: {label: Dropout, default: 0.3, min: 0, max: 0.5, step: 0.05}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}

  general_ptnn:
    label: GeneralPTNN
    category: DNN
    desc: 通用PyTorch模型适配器，可包装任意nn.Module为Qlib模型，支持自定义训练流程
    handler: alpha158
    import_path: quant_master.contrib.model.general_ptnn
    class_name: GeneralPTNNModel
    default_params: {}
    icon: dnn
    complexity: 2
    speed: 3
    params:
      pt_model_uri: {label: 模型URI, default: model.Net}
      lr: {label: 学习率, default: 0.001, min: 0.00001, max: 0.01, step: 0.00001}
      n_epochs: {label: 训练轮数, default: 100, min: 10, max: 500}

  # === 集成 ===
  double_ensemble:
    label: Double Ensemble
    category: 集成
    desc: 双层集成模型：底层多个同质基模型 + 上层Stacking融合，内置残差学习和换手控制
    handler: alpha158
    import_path: quant_master.contrib.model.double_ensemble
    class_name: DEnsembleModel
    default_params:
      base_model: gbm
      loss: mse
      num_models: 3
      enable_sr: true
      enable_fs: true
      alpha1: 1
      alpha2: 1
      bins_sr: 10
      bins_fs: 5
      decay: 0.5
      sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
      sub_weights: [1, 1, 1]
      epochs: 20
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
      verbosity: -1
    icon: ensemble
    complexity: 4
    speed: 2
    params:
      base_model: {label: 基模型, default: lightgbm}
      base_count: {label: 基模型数, default: 5, min: 2, max: 20}
      n_folds: {label: 交叉验证折数, default: 5, min: 2, max: 10}

  multiseed_de:
    label: Multi-Seed DE
    category: 集成
    desc: 多随机种子 Double Ensemble，降低方差
    handler: alpha158
    import_path: quant_master.contrib.model.multiseed_double_ensemble
    class_name: MultiSeedDEnsembleModel
    default_params: { loss: mse, num_models: 3, epochs: 20 }
    icon: ensemble
    complexity: 3
    speed: 3
    params:
      n_seeds: {label: 种子数, default: 10, min: 3, max: 30}
      base_model: {label: 基模型, default: lightgbm}
      aggregation: {label: 聚合方式, default: mean}

  cost_aware_de:
    label: Cost-Aware DE
    category: 集成
    desc: 成本感知双层集成，训练过程中显式纳入交易成本，优化净收益而非毛收益
    handler: alpha158
    import_path: quant_master.contrib.model.cost_aware_double_ensemble
    class_name: CostAwareDEnsembleModel
    default_params: { loss: mse, num_models: 3, epochs: 20 }
    icon: ensemble
    complexity: 4
    speed: 2
    params:
      base_count: {label: 基模型数, default: 5, min: 2, max: 20}
      cost_weight: {label: 成本权重, default: 0.5, min: 0.0, max: 2.0, step: 0.1}
      n_folds: {label: 交叉验证折数, default: 5, min: 2, max: 10}

  low_turnover_de:
    label: Low Turnover DE
    category: 集成
    desc: 低换手双层集成，内置换手惩罚项，适合高交易成本环境
    handler: alpha158
