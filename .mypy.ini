[mypy]
exclude = (?x)(
    ^quant_master/backtest/high_performance_ds\.py$
    | ^quant_master/contrib
    | ^quant_master/data
    | ^quant_master/model
    | ^quant_master/strategy
    | ^quant_master/tests
    | ^quant_master/utils
    | ^quant_master/workflow
    | ^quant_master/config\.py$
    | ^quant_master/log\.py$
    | ^quant_master/__init__\.py$
  )
ignore_missing_imports = true
disallow_incomplete_defs = true
follow_imports = skip
