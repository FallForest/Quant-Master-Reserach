quant_master_init:
  provider_uri: C:\Users\15728\Desktop\Quant-Master-Research\.qmData\cn_data
  region: cn
  kernels: 1
  joblib_backend: threading
market: csi300
benchmark: SH000300
data_handler_config: &id001
  start_time: '2020-01-01'
  end_time: '2026-04-30'
  fit_start_time: '2020-01-01'
  fit_end_time: '2022-12-31'
  instruments: csi300
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: quant_master.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 20
      n_drop: 1
  backtest:
    start_time: '2024-01-01'
    end_time: '2024-03-31'
    account: 100000000
    benchmark: SH000300
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: CostAwareDEnsembleModel
    module_path: quant_master.contrib.model.cost_aware_double_ensemble
    kwargs:
      base_model: gbm
      loss: mse
      num_models: 1
      enable_sr: false
      enable_fs: false
      alpha1: 1
      alpha2: 1
      bins_sr: 10
      bins_fs: 5
      decay: 0.5
      sample_ratios:
      - 0.8
      - 0.7
      - 0.6
      - 0.5
      - 0.4
      sub_weights:
      - 1
      epochs: 4
      topk: 50
      turnover_penalty: 0.0002
      label_rank_weight: 0.5
      stability_weight: 0.3
      trajectory_weight: 1.0
      use_rank_score: true
      random_state: 42
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 4
      verbosity: -1
  dataset:
    class: DatasetH
    module_path: quant_master.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: quant_master.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '2020-01-01'
        - '2022-12-31'
        valid:
        - '2023-01-01'
        - '2023-12-31'
        test:
        - '2024-01-01'
        - '2024-03-31'
  record:
  - class: SignalRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: quant_master.workflow.record_temp
    kwargs:
      config: *id002
